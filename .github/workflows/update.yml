name: Update deals & publish site

on:
  schedule:
    - cron: "17 */6 * * *"        # every 6 hours
  workflow_dispatch:               # "Run workflow" button = refresh now
  push:
    branches: [main]
    paths: ["site/**", "collector/**", ".github/workflows/update.yml"]

permissions:
  contents: write    # save price history to the `data` branch
  pages: write
  id-token: write
  actions: write     # keep the schedule from being auto-disabled

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Load saved history (data branch)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            mkdir -p state && git --work-tree=state checkout origin/data -- . && git reset -q
          else
            mkdir -p state
          fi
          ls -la state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Collect flyers and restaurant deals
        id: collect
        continue-on-error: true
        run: python collector/collect.py --state state --out state/public

      - name: Save history to data branch
        run: |
          cd state
          git init -q -b data
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          # make phones load the matching script/style after every update
          v=$(date +%s)
          sed -i "s#app.js\"#app.js?v=$v\"#; s#style.css\"#style.css?v=$v\"#" _site/index.html
          cp state/public/*.json _site/data/ 2>/dev/null || true
          ls -la _site _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Keep the 6-hour schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true

      - name: Report collector failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::Collector had errors - the site kept the previous data for the failed part."
