name: probe-sources
on:
  workflow_dispatch:
  push:
    paths: ["tools/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests curl_cffi
      - run: python tools/probe.py
      - name: Save samples to probe-data branch
        run: |
          mkdir /tmp/out && cp -r probe_out/* /tmp/out/
          git config user.name probe-bot && git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-data && git rm -rqf . && cp -r /tmp/out/* . 
          git add -A && git commit -qm "probe $(date -u)" && git push -f origin probe-data
